<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BizStarterHub - Secure Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background:#f9f9f9; margin:0; padding:0; }
    .container { max-width:600px; margin:50px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align:center; color:#333; }
    form { display:flex; flex-direction:column; }
    label { margin-top:10px; font-weight:bold; }
    input { padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:4px; }
    button { margin-top:20px; padding:12px; background:#007BFF; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:16px; }
    button:hover { background:#0056b3; }
    .hidden { display:none; }
    .trust { text-align:center; margin-top:20px; }
    .trust img { height:40px; margin:0 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Contact Admin First</h2>
    <p>Please fill out this form. After a short wait, secure payment options will appear.</p>
    <form id="contactForm">
      <label>First Name</label>
      <input type="text" name="firstName" required>
      <label>Last Name</label>
      <input type="text" name="lastName" required>
      <label>Email Address</label>
      <input type="email" name="email" required>
      <label>Message</label>
      <input type="text" name="message" required>
      <button type="submit">Submit</button>
    </form>

    <div id="waitingMessage" class="hidden">
      <h2>Preparing Secure Checkout...</h2>
      <p>Please wait while we verify your request. Payment options will appear shortly.</p>
    </div>

    <div id="paymentSection" class="hidden">
      <h2>Secure Checkout</h2>
      <form>
        <label>Card Number</label>
        <input type="text" placeholder="1234 1234 1234 1234">
        <label>Expiry Date (MM/YY)</label>
        <input type="text" placeholder="MM/YY">
        <label>Security Code</label>
        <input type="text" placeholder="CVC">
        <label>Country/Territory</label>
        <input type="text" placeholder="United States">
        <h3>Total: $149.00 USD</h3>
        <button type="submit">Place Order Now</button>
      </form>
      <div class="trust">
        <img src="visa.png" alt="Visa">
        <img src="mastercard.png" alt="MasterCard">
        <img src="paypal.png" alt="PayPal">
      </div>
    </div>
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e){
      e.preventDefault();
      document.getElementById("contactForm").classList.add("hidden");
      document.getElementById("waitingMessage").classList.remove("hidden");

      // Show payment after 5 minutes (300000 ms)
      setTimeout(function(){
        document.getElementById("waitingMessage").classList.add("hidden");
        document.getElementById("paymentSection").classList.remove("hidden");
      }, 300000);
    });
  </script>
</body>
</html>
