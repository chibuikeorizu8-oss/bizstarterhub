<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BizStarterHub - Payment</title>
</head>
<body>
<h1>Secure Checkout</h1>
<form action="thankyou.html" method="get">
  <h2>Contact Information</h2>
  <input type="text" placeholder="First Name" required><br>
  <input type="text" placeholder="Last Name" required><br>
  <input type="email" placeholder="Email Address" required><br>
  <input type="tel" placeholder="Phone Number" required><br>

  <h2>Billing Information</h2>
  <input type="text" placeholder="Street Address" required><br>
  <input type="text" placeholder="City" required><br>
  <input type="text" placeholder="State" required><br>
  <input type="text" placeholder="ZIP Code" required><br>

  <h2>Payment Information</h2>
  <input type="text" placeholder="Card Number" required><br>
  <input type="text" placeholder="Expiry Date (MM/YY)" required><br>
  <input type="text" placeholder="Security Code" required><br>

  <p>Total: $149.00 USD</p>
  <button type="submit">Place Order Now</button>
</form>
</body>
</html>
