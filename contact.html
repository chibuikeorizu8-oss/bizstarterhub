<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BizStarterHub - Contact</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f9f9f9; }
    nav { background:#2c3e50; padding:15px; text-align:center; }
    nav a { color:#fff; margin:0 15px; text-decoration:none; font-weight:bold; }
    header { background:#3498db; color:#fff; text-align:center; padding:40px 20px; }
    header h1 { margin:0; font-size:2em; }
    section { padding:40px 20px; max-width:700px; margin:auto; }
    form { background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    input, textarea { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; }
    button { background:#3498db; color:#fff; border:none; padding:12px 20px; font-size:1em; cursor:pointer; border-radius:5px; }
    button:hover { background:#2980b9; }
    footer { background:#2c3e50; color:#fff; text-align:center; padding:20px; margin-top:40px; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="features.html">Features</a>
  <a href="payment.html">Join Now</a>
  <a href="contact.html">Contact</a>
</nav>

<header>
  <h1>Contact BizStarterHub</h1>
  <p>We’d love to hear from you! Fill out the form below and we’ll get back to you soon.</p>
</header>

<section>
  <form action="thankyou.html" method="post">
    <label for="name">Your Name</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Your Email</label>
    <input type="email" id="email" name="email" required>

    <label for="message">Your Message</label>
    <textarea id="message" name="message" rows="6" required></textarea>

    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 BizStarterHub | info@bizstarterhub.com</p>
</footer>

</body>
</html>
