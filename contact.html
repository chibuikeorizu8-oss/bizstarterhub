<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact - BizStarterHub</title>
  <style>
    body {font-family:'Segoe UI', Arial, sans-serif; background:#f9f9f9; margin:0;}
    header {background:#007BFF; color:#fff; padding:20px; text-align:center;}
    .container {max-width:600px; margin:40px auto; padding:20px; background:#fff; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
    input, textarea {width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px;}
    button {padding:12px 25px; background:#007BFF; color:#fff; border:none; border-radius:5px; font-weight:bold;}
    button:hover {background:#0056b3;}
    footer {text-align:center; padding:20px; background:#333; color:#fff; margin-top:40px;}
  </style>
</head>
<body>

<header>
  <h1>Contact BizStarterHub</h1>
</header>

<div class="container">
  <form>
    <input type="text" placeholder="Full Name" required>
    <input type="email" placeholder="Email Address" required>
    <textarea placeholder="Message" rows="5" required></textarea>
    <button type="submit">Send Message</button>
  </form>
</div>

<footer>
  © 2026 BizStarterHub — Empowering Entrepreneurs Worldwide
</footer>

</body>
</html>
